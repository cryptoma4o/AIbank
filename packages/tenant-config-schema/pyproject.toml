[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tenant-config-schema"
version = "0.1.0"
description = "JSON Schema validation for AIbank tenant configuration files"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.scripts]
validate-tenant-config = "validate:main"
