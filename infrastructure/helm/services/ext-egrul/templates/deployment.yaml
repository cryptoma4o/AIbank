apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ext-egrul.fullname" . }}
  labels:
    {{- include "ext-egrul.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ext-egrul.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ext-egrul.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: ext-egrul
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8090
              protocol: TCP
          env:
            - name: REDIS_URL
              value: {{ .Values.env.REDIS_URL | quote }}
            - name: EGRUL_API_URL
              value: {{ .Values.env.EGRUL_API_URL | quote }}
            - name: AUDIT_URL
              value: {{ .Values.env.AUDIT_URL | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
