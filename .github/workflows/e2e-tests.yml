name: E2E Tests Lint

# Lightweight CI для tests/e2e/ — проверяет что сам код тестов корректен:
# pytest collect-only (находит синтаксис ошибок), tsc по Playwright spec'ам,
# python-import check для tools/legal-corpus/.
#
# Полный прогон E2E делается отдельно: systemd timer на staging-сервере
# каждый час (см. infrastructure/systemd/aibank-e2e.{service,timer}).
# CI здесь только ловит regressions в коде тестов до того как они попадут
# в hourly-runner.
#
# Security note: no user-controlled inputs are interpolated into run: blocks.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "tests/e2e/**"
      - "tools/legal-corpus/**"
      - "scripts/seed-staging-companies.py"
      - ".github/workflows/e2e-tests.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-syntax:
    name: API tests — pytest collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest + deps
        run: |
          pip install "pytest>=8.0" "pytest-json-report>=1.5"
      - name: Collect-only (находит import/syntax errors)
        run: |
          python -m pytest tests/e2e/api --collect-only -q

  ui-typecheck:
    name: UI tests — Playwright tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/e2e/ui/package.json
      - name: Install deps
        working-directory: tests/e2e/ui
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        working-directory: tests/e2e/ui
        run: npx tsc --noEmit -p .
      - name: Playwright config validate
        working-directory: tests/e2e/ui
        run: npx playwright test --list

  legal-corpus-syntax:
    name: Legal corpus — import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install corpus deps
        run: |
          pip install httpx pyyaml beautifulsoup4 lxml
      - name: Syntax + import check
        run: |
          python -m py_compile tools/legal-corpus/fetch.py tools/legal-corpus/chunk_and_index.py
      - name: Validate sources.yaml
        run: |
          python -c "import yaml; d=yaml.safe_load(open('tools/legal-corpus/sources.yaml')); assert d['documents'], 'empty'; print(f'OK: {len(d[\"documents\"])} documents')"
