replicaCount: 2

image:
  repository: aibank/web-admin
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: "admin.aibank.ru"
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  BFF_ADMIN_URL: "http://bff-admin:8095/graphql"
