# docker-compose.override.yml — automatic merge с docker-compose.yml.
#
# Причины существования (см. отдельные секции):
# 1) Build context fix для Go-сервисов (replace ../../packages/* нужен
#    monorepo build context, а не папку сервиса).
# 2) MinIO pin к 2022-06 (CPU compat для x86-64-v1 QEMU staging).
# 3) Temporal env DB=postgres12 (вместо неправильного "postgresql").
# 4) Healthcheck disable для distroless (Go) / slim (Python) — в них
#    нет wget/curl, healthcheck always fails.
# 5) Port collision MinIO (9001) vs abs-adapter-cft (9001) — MinIO console
#    переезжает на host:9101.

services:

  # ────────────────────────────────────────────────────────────
  # Stateful infrastructure overrides
  # ────────────────────────────────────────────────────────────

  minio:
    image: minio/minio:RELEASE.2022-06-25T15-50-16Z
    ports:
      - "9000:9000"
      - "9101:9001"
    # 2022-06 образ не содержит `mc` (используется в healthcheck из main
    # docker-compose.yml). Переопределяем на curl против /minio/health/ready,
    # который сам сервер обслуживает.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: aibank
      POSTGRES_PWD: aibank
      POSTGRES_SEEDS: postgres

  # Port collision: temporal-ui биндит host:8089, и client-service
  # тоже host:8089 (свой API). Переезд temporal-ui на host:8094.
  # Client-service остаётся на 8089 (используется в коде / agentDoc).
  temporal-ui:
    ports:
      - "8094:8080"

  # NEXT_PUBLIC_*_URL — публичный hostname для browser-side fetch.
  # Frontend: dev-mode чтобы NEXT_PUBLIC_* env читались runtime.
  # Production image (Dockerfile multi-stage) содержит только .next/standalone
  # без src/ → `next dev` не находит app/. Bind-mount исходников из
  # /opt/aibank + анонимный volume на /app/node_modules чтобы bind-mount
  # не затёр модули.
  # ВАЖНО: standalone-build генерирует обрезанный node_modules (tree-shaken
  # для prod runtime), который инициализирует анонимный volume при первом
  # старте. Поэтому команда сначала `rm -rf node_modules` — иначе пакеты
  # вроде @swc/helpers распакованы не полностью и dev-mode падает с
  # 'Module not found: _class_private_field_loose_base'.
  # Ports: package.json scripts — web-admin :3001, web-onboarding :3000.
  # NODE_ENV=development нужен для dev-mode: Dockerfile runtime stage
  # выставляет NODE_ENV=production, из-за чего `npm install` пропускает
  # devDependencies (tailwindcss, postcss, autoprefixer) → webpack не
  # может парсить @tailwind в globals.css → 500 на каждой странице.
  web-admin:
    command: ["sh", "-c", "find node_modules -mindepth 1 -maxdepth 1 -exec rm -rf {} + && npm install --legacy-peer-deps --no-audit --no-fund && npm run dev"]
    ports:
      - "3001:3001"
    volumes:
      - ./apps/web-admin:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_IDENTITY_SERVICE_URL: http://206.204.106.28:8082
      NEXT_PUBLIC_BFF_ADMIN_URL: http://206.204.106.28:8092/graphql

  web-onboarding:
    command: ["sh", "-c", "find node_modules -mindepth 1 -maxdepth 1 -exec rm -rf {} + && npm install --legacy-peer-deps --no-audit --no-fund && npm run dev"]
    volumes:
      - ./apps/web-onboarding:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_IDENTITY_SERVICE_URL: http://206.204.106.28:8082
      NEXT_PUBLIC_BFF_ONBOARDING_URL: http://206.204.106.28:8091/graphql

  # ────────────────────────────────────────────────────────────
  # Go-сервисы: monorepo build context + healthcheck disable
  # (distroless static-debian12:nonroot — нет shell для wget)
  # ────────────────────────────────────────────────────────────

  tenant-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/tenant-service
    healthcheck:
      disable: true

  audit-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/audit-service
    healthcheck:
      disable: true

  identity-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/identity-service
    healthcheck:
      disable: true
    environment:
      JWT_SECRET: aibank-staging-dev-secret-32bytes-minimum-do-not-use-in-prod
      CORS_ALLOWED_ORIGINS: http://206.204.106.28:3000,http://206.204.106.28:3001

  document-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/document-service
    healthcheck:
      disable: true

  notification-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/notification-service

  onboarding-orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/onboarding-orchestrator
    environment:
      # Этап 1 формы — параллельный скоринг через ext-* сервисы.
      # Hostname'ы — internal docker network (см. docker-compose.yml).
      EXT_EGRUL_URL: http://ext-egrul:8201
      EXT_ROSFINMON_URL: http://ext-rosfinmon:8202
      EXT_FSSP_URL: http://ext-fssp:8203

  risk-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/risk-engine

  client-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/client-service

  ubo-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/ubo-service

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/api-gateway
    environment:
      JWT_SECRET: aibank-staging-dev-secret-32bytes-minimum-do-not-use-in-prod
      AUTH_DEV_MODE: "1"

  ext-egrul:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/ext-egrul

  ext-rosfinmon:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/ext-rosfinmon

  ext-fssp:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/ext-fssp

  abs-connector:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/abs-connector

  abs-adapter-cft:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/abs-adapter-cft

  abs-adapter-diasoft:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/abs-adapter-diasoft

  abs-adapter-rs-bank:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/abs-adapter-rs-bank

  billing-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/billing-service

  bff-onboarding:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/bff-onboarding
    environment:
      JWT_SECRET: aibank-staging-dev-secret-32bytes-minimum-do-not-use-in-prod
      CORS_ALLOWED_ORIGINS: http://206.204.106.28:3000,http://206.204.106.28:3001

  bff-admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/bff-admin
    environment:
      JWT_SECRET: aibank-staging-dev-secret-32bytes-minimum-do-not-use-in-prod
      CORS_ALLOWED_ORIGINS: http://206.204.106.28:3000,http://206.204.106.28:3001

  db-migrator-platform:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: tools/db-migrator

  # ────────────────────────────────────────────────────────────
  # Python AI-агенты: healthcheck disable (slim — нет wget/curl)
  # ────────────────────────────────────────────────────────────

  # llm-gateway имеет 4 зависимых сервиса с depends_on service_healthy
  # (agent-document-intake, -reconciliation, -ubo-tracing, -conversational).
  # disable: true ломает condition → "no healthcheck configured".
  # Заменяем wget на Python urllib (gateway сам на python:3.12-slim).
  #
  # Staging-конфиг: переключаем с mock на Ollama (T-Lite + Qwen-VL).
  # staging-ollama.yaml монтируется в /app/configs/ через bind-mount,
  # чтобы не пересобирать image gateway. Конфиг по умолчанию остаётся
  # в image (default-routing.yaml для GPU-vLLM).
  llm-gateway:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      LLM_GATEWAY_FORCE_MOCK: "0"
      LLM_GATEWAY_CONFIG: /app/configs/staging-ollama.yaml
    volumes:
      - ./ai/llm-gateway/configs/staging-ollama.yaml:/app/configs/staging-ollama.yaml:ro
    depends_on:
      ollama:
        condition: service_started

  agent-document-intake:
    healthcheck:
      disable: true

  agent-reconciliation:
    healthcheck:
      disable: true

  agent-ubo-tracing:
    healthcheck:
      disable: true

  agent-conversational:
    healthcheck:
      disable: true

  # ────────────────────────────────────────────────────────────
  # TEI (Text Embeddings Inference) — sidecar для rag-service.
  # Хостит BAAI/bge-m3 (1024-мерные multilingual embeddings, хороший русский).
  # Cold-start на CPU ~60-90 сек.
  # ────────────────────────────────────────────────────────────
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: aibank-tei-1
    restart: unless-stopped
    networks: [default]
    volumes:
      - tei-models:/data
    environment:
      # Явно указываем HF endpoint — в старых tag'ах cpu-1.5 был баг
      # "relative URL without a base", который чинится этой переменной.
      HF_ENDPOINT: https://huggingface.co
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    command:
      - "--model-id"
      - "BAAI/bge-m3"
      - "--port"
      - "80"
    ports:
      - "127.0.0.1:8002:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 300s    # BGE-M3 = ~2.3GB, на CPU cold-load 2-4 мин

  # ────────────────────────────────────────────────────────────
  # rag-service — semantic search over banking regulations.
  # Embedder=tei (BGE-M3 1024-мер), backend=qdrant (per-tenant collections).
  # ────────────────────────────────────────────────────────────
  rag-service:
    build: ./ai/rag-service
    container_name: aibank-rag-service-1
    restart: unless-stopped
    networks: [default]
    environment:
      RAG_EMBEDDER: tei
      RAG_TEI_URL: http://tei:80
      RAG_EMBED_DIM: "1024"
      QDRANT_URL: http://qdrant:6333
      RAG_BACKEND: qdrant
      RAG_RERANKER: lexical    # без GPU — оставляем lexical
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8105:8105"
    depends_on:
      qdrant:
        condition: service_started
      tei:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8105/healthz').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ────────────────────────────────────────────────────────────
  # agent-compliance-assistant — Q&A по 115-ФЗ через RAG + LLM.
  # В main docker-compose.yml не определён, поднимаем здесь.
  # ────────────────────────────────────────────────────────────
  agent-compliance-assistant:
    build: ./ai/agent-compliance-assistant
    container_name: aibank-agent-compliance-assistant-1
    restart: unless-stopped
    networks: [default]
    environment:
      LLM_GATEWAY_URL: http://llm-gateway:8100
      RAG_SERVICE_URL: http://rag-service:8105
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8106:8106"
    depends_on:
      llm-gateway:
        condition: service_started
      rag-service:
        condition: service_started
    healthcheck:
      disable: true

  # ────────────────────────────────────────────────────────────
  # Ollama: локальный inference для staging (CPU, T-Lite + Qwen-VL).
  # См. ai/llm-gateway/configs/staging-ollama.yaml и Modelfile.*.
  # Модели загружаются один раз через scripts/setup-ollama-staging.sh.
  # ────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: aibank-ollama-1
    restart: unless-stopped
    networks: [default]
    volumes:
      - ollama-models:/root/.ollama
      - ./ai/llm-gateway/configs/Modelfile.tlite:/modelfiles/Modelfile.tlite:ro
      - ./ai/llm-gateway/configs/Modelfile.qwen-vl:/modelfiles/Modelfile.qwen-vl:ro
    ports:
      # Только localhost — порт не публикуется наружу (наш hygiene-стандарт).
      - "127.0.0.1:11434:11434"
    environment:
      # Держать модель в RAM 30 мин после последнего запроса.
      # На CPU cold-start 15-30 сек, поэтому keep-alive экономит время.
      OLLAMA_KEEP_ALIVE: "30m"
      # 2 параллельных запроса (8 vCPU делятся: 4 на T-Lite, 4 на vision).
      OLLAMA_NUM_PARALLEL: "2"
      # Не нужен сам по себе (CPU), но safe-default чтобы Ollama не пыталась
      # детектить GPU.
      OLLAMA_NUM_GPU: "0"

volumes:
  ollama-models:
  tei-models:
