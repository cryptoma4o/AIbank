---
- name: Setup Kafka KRaft cluster
  hosts: masters
  tasks:
    - name: Install Java 21
      apt:
        name: openjdk-21-jre-headless
        state: present

    - name: Create kafka user
      user:
        name: kafka
        system: true
        shell: /sbin/nologin
        home: /opt/kafka

    - name: Download Kafka
      get_url:
        url: "https://downloads.apache.org/kafka/{{ kafka_version }}/kafka_2.13-{{ kafka_version }}.tgz"
        dest: "/tmp/kafka.tgz"

    - name: Extract Kafka
      unarchive:
        src: /tmp/kafka.tgz
        dest: /opt/
        remote_src: true
        creates: "/opt/kafka_2.13-{{ kafka_version }}"

    - name: Create kafka symlink
      file:
        src: "/opt/kafka_2.13-{{ kafka_version }}"
        dest: /opt/kafka
        state: link

    - name: Create Kafka data directory
      file:
        path: "{{ kafka_data_dir }}"
        state: directory
        owner: kafka
        group: kafka

    - name: Generate Kafka cluster UUID (on first master)
      command: /opt/kafka/bin/kafka-storage.sh random-uuid
      register: kafka_uuid
      run_once: true
      delegate_to: "{{ groups['masters'][0] }}"

    - name: Configure Kafka KRaft
      template:
        src: kafka-kraft.properties.j2
        dest: /opt/kafka/config/kraft/server.properties
        owner: kafka
        group: kafka
      notify: restart kafka

    - name: Install Kafka systemd service
      copy:
        content: |
          [Unit]
          Description=Apache Kafka KRaft
          After=network.target

          [Service]
          User=kafka
          Group=kafka
          Environment=KAFKA_HEAP_OPTS=-Xmx{{ kafka_heap_size }} -Xms{{ kafka_heap_size }}
          ExecStart=/opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties
          ExecStop=/opt/kafka/bin/kafka-server-stop.sh
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/kafka.service
      notify:
        - reload systemd
        - restart kafka

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: true
    - name: restart kafka
      service:
        name: kafka
        state: restarted
        enabled: true
