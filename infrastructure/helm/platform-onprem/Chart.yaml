apiVersion: v2
name: platform-onprem
description: |
  AIbank umbrella chart — on-prem deployment.

  Same set of stateless services as platform-saas, but with on-prem
  defaults (lower replica counts, NetworkPolicy enforced, smaller
  resource budgets to fit on bank hardware).

  Stateful infra (Postgres, Kafka, Redis, MinIO, Temporal) is treated
  as bank-provided by default and is NOT bundled here. Optional
  dependencies on the wrapper charts are listed under `condition` and
  must be explicitly enabled.

  Per ADR-0009: deploy this chart twice — once into `platform-blue`,
  once into `platform-green` — for blue-green updates.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - aibank
  - on-prem
  - umbrella
  - bank
maintainers:
  - name: AIbank Platform Team
    email: platform@aibank.local

dependencies:
