openapi: 3.0.3
info:
  title: AIbank risk-engine
  version: "1.0.0"
  description: |
    Computes risk assessments for applications. Each call runs the
    pipeline (rule engine + screening + scoring) and persists a
    `RiskAssessment` row in the tenant schema.

    Replaces the earlier placeholder `/v1/score` spec; the actual
    handler routes are `POST /v1/assessments`, `GET /v1/assessments`,
    `GET /v1/assessments/{id}` (see `internal/handler/assessment.go`).
servers:
  - url: http://risk-engine:8086

tags:
  - name: assessments
  - name: ops

paths:
  /health:
    get:
      tags: [ops]
      summary: Liveness probe
      operationId: health
      responses:
        "200": { description: Alive. }

  /ready:
    get:
      tags: [ops]
      summary: Readiness probe
      operationId: ready
      responses:
        "200": { description: Ready. }
        "503": { description: Not ready. }

  /v1/assessments:
    post:
      tags: [assessments]
      summary: Run a risk assessment for an application
      operationId: createAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssessmentRequest'
            examples:
              standard:
                value:
                  tenant_id: bank_alpha
                  application_id: app_01J9YQH7
                  input_data:
                    inn: "7707083893"
                    company_age_days: 12410
                    okved_primary: "64.19"
      responses:
        "201":
          description: Assessment persisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAssessment'
        "400":
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingTenant:
                  value:
                    error:
                      code: validation_failed
                      message: tenant_id is required
        "500":
          description: Pipeline error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [assessments]
      summary: List assessments by application
      operationId: listAssessments
      parameters:
        - $ref: '#/components/parameters/TenantQuery'
        - name: application_id
          in: query
          required: true
          schema:
            type: string
          example: app_01J9YQH7
      responses:
        "200":
          description: Assessments ordered newest-first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAssessmentList'
        "400":
          description: Missing tenant_id or application_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/assessments/{id}:
    get:
      tags: [assessments]
      summary: Get an assessment by id
      operationId: getAssessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: ra_01J9YQH7
        - $ref: '#/components/parameters/TenantQuery'
      responses:
        "200":
          description: Assessment found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAssessment'
        "400":
          description: Missing tenant_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Not found in this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    TenantQuery:
      name: tenant_id
      in: query
      required: true
      schema:
        type: string
      example: bank_alpha

  schemas:
    RiskCategory:
      type: string
      enum: [LOW, MEDIUM, HIGH]
      description: Bucketed score (`<0.3` → LOW, `<0.7` → MEDIUM, else HIGH).

    Direction:
      type: string
      enum: [INCREASES_RISK, DECREASES_RISK]
      description: SHAP-style direction marker on a `Factor`.

    RuleSeverity:
      type: string
      enum: [WARNING, BLOCKING]

    Recommendation:
      type: string
      enum: [AUTO_APPROVE, MANUAL_REVIEW, DECLINE_RECOMMENDED]

    Factor:
      type: object
      required: [name, weight, direction]
      properties:
        name:
          type: string
          example: company_age_days
        value:
          description: Original input value (any JSON type).
        weight:
          type: number
          format: double
          example: 0.18
        direction:
          $ref: '#/components/schemas/Direction'

    RuleTriggered:
      type: object
      required: [rule_id, severity, description]
      properties:
        rule_id:
          type: string
          example: low_company_age
        severity:
          $ref: '#/components/schemas/RuleSeverity'
        description:
          type: string

    ScreeningMatch:
      type: object
      required: [list_name, matched_field, confidence]
      properties:
        list_name:
          type: string
          example: rosfinmon
        matched_field:
          type: string
          example: full_name
        confidence:
          type: number
          format: double

    ScreeningResult:
      type: object
      required: [source, checked_at, has_matches, matches]
      properties:
        source:
          type: string
          example: rosfinmon
        checked_at:
          type: string
          format: date-time
        has_matches:
          type: boolean
        matches:
          type: array
          items:
            $ref: '#/components/schemas/ScreeningMatch'

    ScreeningResults:
      type: object
      required: [rosfinmon, fssp]
      properties:
        rosfinmon:
          $ref: '#/components/schemas/ScreeningResult'
        fssp:
          $ref: '#/components/schemas/ScreeningResult'

    ModelInfo:
      type: object
      required: [name, version, computed_at]
      properties:
        name:
          type: string
          example: rules-v1
        version:
          type: string
          example: "2026-04-01"
        computed_at:
          type: string
          format: date-time

    Explanation:
      type: object
      required: [text, generated_by]
      properties:
        text:
          type: string
        generated_by:
          type: string
          example: agent-risk-scoring

    RiskAssessment:
      type: object
      required:
        - id
        - tenant_id
        - application_id
        - score
        - category
        - model
        - factors
        - rules_triggered
        - screening_results
        - explanation
        - recommendation
      properties:
        id:
          type: string
          example: ra_01J9YQH7
        tenant_id:
          type: string
          example: bank_alpha
        application_id:
          type: string
          example: app_01J9YQH7
        legal_entity_id:
          type: string
        score:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          example: 0.42
        category:
          $ref: '#/components/schemas/RiskCategory'
        model:
          $ref: '#/components/schemas/ModelInfo'
        factors:
          type: array
          items:
            $ref: '#/components/schemas/Factor'
        rules_triggered:
          type: array
          items:
            $ref: '#/components/schemas/RuleTriggered'
        screening_results:
          $ref: '#/components/schemas/ScreeningResults'
        explanation:
          $ref: '#/components/schemas/Explanation'
        recommendation:
          $ref: '#/components/schemas/Recommendation'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RiskAssessmentList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RiskAssessment'
        count:
          type: integer

    CreateAssessmentRequest:
      type: object
      required: [tenant_id, application_id]
      properties:
        tenant_id:
          type: string
        application_id:
          type: string
        input_data:
          type: object
          additionalProperties: true
          description: Free-form facts forwarded to the rule engine.
        rules_pack_path:
          type: string
          description: Reserved for per-tenant rule overrides; ignored today.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: assess_failed
            message:
              type: string
              example: rule engine unavailable
