replicaCount: 1

image:
  repository: aibank/identity-service
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8086

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  DATABASE_URL: ""
  KEYCLOAK_URL: "http://keycloak:8080"
  AUDIT_URL: "http://audit-service:8081"
  JWT_PRIVATE_KEY_PEM: ""
