replicaCount: 1

image:
  repository: aibank/agent-ubo-tracing
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8102

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  LLM_GATEWAY_URL: "http://llm-gateway:8100"
  EGRUL_URL: "http://ext-egrul:8090"
  AUDIT_URL: "http://audit-service:8081"
