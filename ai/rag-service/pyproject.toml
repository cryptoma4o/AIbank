[project]
name = "rag-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "qdrant-client>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.1",
]
audit = [
    # Install via local path: `pip install -e packages/audit-sdk/python`.
    "aibank-audit-sdk>=0.1.0",
]

[tool.setuptools]
# Явный список пакетов: после появления `configs/` (yaml-файлы только)
# setuptools auto-discovery валится с «Multiple top-level packages».
packages = ["models", "service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
