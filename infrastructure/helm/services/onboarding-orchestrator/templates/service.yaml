apiVersion: v1
kind: Service
metadata:
  name: {{ include "onboarding-orchestrator.fullname" . }}
  labels:
    {{- include "onboarding-orchestrator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8084
      protocol: TCP
  selector:
    {{- include "onboarding-orchestrator.selectorLabels" . | nindent 4 }}
