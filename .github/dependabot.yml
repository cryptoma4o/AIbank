version: 2

# Weekly dependency updates across the polyglot monorepo.
# Each module gets its own update entry so PRs are scoped per-package and
# stay reviewable.

updates:
  # ─── GitHub Actions ───────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    labels: ["dependencies", "ci"]
    reviewers: ["devops"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  # ─── Go modules: services/* (21 services) ────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/services/abs-adapter-cft"
    schedule: { interval: "weekly", day: "monday" }
    labels: ["dependencies", "go", "services"]
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
