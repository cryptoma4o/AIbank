apiVersion: v1
kind: Service
metadata:
  name: {{ include "ext-egrul.fullname" . }}
  labels:
    {{- include "ext-egrul.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8090
      protocol: TCP
      name: http
  selector:
    {{- include "ext-egrul.selectorLabels" . | nindent 4 }}
