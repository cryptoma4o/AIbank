[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aibank-data-generator"
version = "0.1.0"
description = "Synthetic Russian banking document generator for AIbank evaluation datasets"
requires-python = ">=3.11"
dependencies = [
    "faker>=25.0",
    "fpdf2>=2.7",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
aibank-generate = "tools.data_generator.main:cli"
generate = "generator.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["E501"]
