apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onboarding-orchestrator.fullname" . }}
  labels:
    {{- include "onboarding-orchestrator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "onboarding-orchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "onboarding-orchestrator.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: onboarding-orchestrator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8084
              protocol: TCP
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.address | default .Values.global.temporal.address | quote }}
            - name: DATABASE_URL
              value: "postgres://aibank:$(POSTGRESQL_PASSWORD)@{{ .Values.global.postgresql.host }}:{{ .Values.global.postgresql.port }}/{{ .Values.global.postgresql.database }}"
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.postgresql.existingSecret }}
                  key: {{ .Values.global.postgresql.secretKey }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
