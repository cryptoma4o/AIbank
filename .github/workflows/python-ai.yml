name: Python AI CI

# Lint + test every Python project (AI agents, llm-gateway, eval-harness,
# audit-sdk Python binding, tenant-config-schema). Each project runs in its
# own matrix slot so they fail independently and finish in ~2-3 min total.
#
# Security note: no user-controlled inputs are interpolated into run: blocks.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "ai/**"
      - "packages/audit-sdk/python/**"
      - "packages/tenant-config-schema/**"
      - ".github/workflows/python-ai.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project:
          - { name: "ai/llm-gateway",                  path: "ai/llm-gateway" }
          - { name: "ai/rag-service",                  path: "ai/rag-service" }
          - { name: "ai/eval-harness",                 path: "ai/eval-harness" }
          - { name: "ai/agent-conversational",         path: "ai/agent-conversational" }
          - { name: "ai/agent-document-intake",        path: "ai/agent-document-intake" }
          - { name: "ai/agent-risk-scoring",           path: "ai/agent-risk-scoring" }
          - { name: "ai/agent-ubo-tracing",            path: "ai/agent-ubo-tracing" }
          - { name: "ai/agent-reconciliation",         path: "ai/agent-reconciliation" }
          - { name: "ai/agent-compliance-assistant",   path: "ai/agent-compliance-assistant" }
          - { name: "packages/audit-sdk/python",       path: "packages/audit-sdk/python" }
          - { name: "packages/tenant-config-schema",   path: "packages/tenant-config-schema" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: ${{ matrix.project.path }}/pyproject.toml

      - name: Install ruff (lint)
        run: pip install --quiet "ruff>=0.5"

      - name: Ruff lint
        working-directory: ${{ matrix.project.path }}
        env:
          PROJECT_NAME: ${{ matrix.project.name }}
        run: |
          if ! ruff check . ; then
            echo "::warning::ruff issues in ${PROJECT_NAME}"
            exit 1
          fi

      - name: Install project (editable + dev extras with fallback)
        working-directory: ${{ matrix.project.path }}
        run: |
          set -e
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null \
              || pip install -e . 2>/dev/null \
              || pip install fastapi pytest pytest-asyncio httpx pydantic rich click uvicorn
          else
            pip install fastapi pytest pytest-asyncio httpx pydantic rich click uvicorn
          fi
          pip install --quiet pytest pytest-asyncio

      - name: pytest
        working-directory: ${{ matrix.project.path }}
        env:
          PROJECT_NAME: ${{ matrix.project.name }}
        run: |
          if [ -d tests ]; then
            python -m pytest tests/ -v --tb=short
          else
            echo "::warning::no tests/ directory in ${PROJECT_NAME} — skipping pytest"
          fi

  python-ai-ok:
    name: Python AI CI (aggregate)
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Verify all Python matrix jobs passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "One or more Python projects failed — see matrix above."
            exit 1
          fi
          echo "All Python AI projects passed lint + tests."
