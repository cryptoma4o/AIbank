# docker-compose.override.yml — automatic merge с docker-compose.yml.
#
# Назначение: переопределить build для всех Go-сервисов AIbank на
# monorepo-context build (context=., dockerfile=docker/Dockerfile.go-service).
# Это нужно потому что сервисы используют go.mod replace на ../../packages/*,
# и старый build: ./services/X не имеет packages/ в build context.
#
# Старые Dockerfile'ы в каждом services/X/Dockerfile сохранены для
# обратной совместимости (для DevOps, которые билдят отдельный сервис),
# но НЕ работают из-за replace проблемы. docker compose использует
# этот override автоматически.
#
# При обновлении списка сервисов — добавь сюда новый блок и не забудь
# про docker-compose.yml (главный файл) тоже.

services:
  # Port collision fix: и MinIO console и abs-adapter-cft биндились
  # на host:9001. MinIO console — диагностический, переносим на 9101.
  # Внутри docker network он по-прежнему доступен на :9001.
  #
  # CPU compat fix: MinIO release ≥2024-01 требует x86-64-v2 (SSE4.2 etc).
  # На старых VPS (наш staging at-bastion) — fatal glibc. Pin последнюю
  # 2023 версию, которая работает на x86-64-v1.
  minio:
    image: minio/minio:RELEASE.2023-12-23T07-19-11Z
    ports:
      - "9000:9000"
      - "9101:9001"

  # Temporal auto-setup ожидает driver name "postgres12" (или
  # postgres12_pgx), не "postgresql". В docker-compose.yml main
  # значение неправильное — патчим через override.
  temporal:
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: aibank
      POSTGRES_PWD: aibank
      POSTGRES_SEEDS: postgres

  tenant-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/tenant-service

