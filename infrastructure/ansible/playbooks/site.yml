---
- name: AIbank full on-prem deployment
  import_playbook: 01_prerequisites.yml

- name: Install containerd
  import_playbook: 02_containerd.yml

- name: Setup Kubernetes cluster
  import_playbook: 03_kubernetes.yml

- name: Setup MinIO storage
  import_playbook: 04_storage.yml

- name: Setup databases
  import_playbook: 05_databases.yml

- name: Setup Kafka
  import_playbook: 06_kafka.yml

- name: Deploy AIbank application
  import_playbook: 07_aibank.yml

# Запускается только при deployment_mode == on_prem (gating внутри самого
# play через `meta: end_play`). На SaaS-инсталляциях Istio управляется
# облачным provider'ом, поэтому import можно оставить безусловным.
- name: Install Istio control plane + apply mTLS mesh policies (on-prem only)
  import_playbook: 08_istio_mtls.yml
