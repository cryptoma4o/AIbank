replicaCount: 1

image:
  repository: aibank/ext-egrul
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8090

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

env:
  REDIS_URL: "redis://redis:6379"
  EGRUL_API_URL: ""
  AUDIT_URL: "http://audit-service:8081"
