    labels: ["dependencies", "npm", "frontend"]
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      next:
        patterns: ["next", "react", "react-dom", "@next/*"]
      typescript-tooling:
        patterns: ["typescript", "@types/*", "eslint*", "@typescript-eslint/*"]

