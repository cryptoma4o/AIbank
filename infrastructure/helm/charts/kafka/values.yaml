# Recommended values for the upstream Bitnami kafka chart in KRaft mode.
# helm install kafka oci://registry-1.docker.io/bitnamicharts/kafka \
#   -f charts/kafka/values.yaml

image:
  registry: docker.io
  repository: bitnami/kafka
  tag: "3.7.0-debian-12-r0"

# KRaft mode (no Zookeeper) — matches docker-compose.yml.
kraft:
  enabled: true

# Three controllers + three brokers for production. For dev/staging
# you can run controller.replicaCount=1 + broker.replicaCount=1.
controller:
  replicaCount: 3
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  persistence:
    enabled: true
    size: 20Gi

broker:
  replicaCount: 3
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2
      memory: 4Gi
  persistence:
    enabled: true
    size: 100Gi

# Strong defaults for durability — banks demand it.
defaultReplicationFactor: 3
offsetsTopicReplicationFactor: 3
transactionStateLogReplicationFactor: 3
transactionStateLogMinIsr: 2
minInSyncReplicas: 2

# Enable PLAINTEXT internal + SASL_SSL external in production.
listeners:
  client:
    protocol: SASL_PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: SASL_PLAINTEXT

sasl:
  enabledMechanisms: SCRAM-SHA-512
  existingSecret: aibank-kafka-credentials

metrics:
  jmx:
    enabled: true
  kafka:
    enabled: true
  serviceMonitor:
    enabled: false
