# docker-compose.override.yml — automatic merge с docker-compose.yml.
#
# Причины существования (см. отдельные секции):
# 1) Build context fix для Go-сервисов (replace ../../packages/* нужен
#    monorepo build context, а не папку сервиса).
# 2) MinIO pin к 2022-06 (CPU compat для x86-64-v1 QEMU staging).
# 3) Temporal env DB=postgres12 (вместо неправильного "postgresql").
# 4) Healthcheck disable для distroless (Go) / slim (Python) — в них
#    нет wget/curl, healthcheck always fails.
# 5) Port collision MinIO (9001) vs abs-adapter-cft (9001) — MinIO console
#    переезжает на host:9101.

services:

  # ────────────────────────────────────────────────────────────
  # Stateful infrastructure overrides
  # ────────────────────────────────────────────────────────────

  minio:
    image: minio/minio:RELEASE.2022-06-25T15-50-16Z
    ports:
      - "9000:9000"
      - "9101:9001"

  temporal:
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: aibank
      POSTGRES_PWD: aibank
      POSTGRES_SEEDS: postgres

  # Port collision: temporal-ui биндит host:8089, и client-service
  # тоже host:8089 (свой API). Переезд temporal-ui на host:8094.
  # Client-service остаётся на 8089 (используется в коде / agentDoc).
  temporal-ui:
    ports:
      - "8094:8080"

  # web-admin Next.js слушает container:3000 (default Next.js port),
  # а main mapping 3001:3001 биндит на не-listening 3001. Меняем на
  # 3001:3000 чтобы host:3001 → container:3000.
  # NEXT_PUBLIC_*_URL — публичный hostname для browser-side fetch.
  web-admin:
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_IDENTITY_SERVICE_URL: http://206.204.106.28:8082
      NEXT_PUBLIC_BFF_ADMIN_URL: http://206.204.106.28:8092/graphql

  web-onboarding:
    environment:
      NEXT_PUBLIC_IDENTITY_SERVICE_URL: http://206.204.106.28:8082
      NEXT_PUBLIC_BFF_ONBOARDING_URL: http://206.204.106.28:8091/graphql

  # ────────────────────────────────────────────────────────────
  # Go-сервисы: monorepo build context + healthcheck disable
  # (distroless static-debian12:nonroot — нет shell для wget)
  # ────────────────────────────────────────────────────────────

  tenant-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/tenant-service
    healthcheck:
      disable: true

  audit-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/audit-service
    healthcheck:
      disable: true

  identity-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/identity-service
    healthcheck:
      disable: true
    environment:
      JWT_SECRET: aibank-staging-dev-secret-32bytes-minimum-do-not-use-in-prod

  document-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/document-service
    healthcheck:
      disable: true

  notification-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/notification-service

  onboarding-orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/onboarding-orchestrator

  risk-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/risk-engine

  client-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/client-service

  ubo-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/ubo-service

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/api-gateway
    environment:
      JWT_SECRET: aibank-staging-dev-secret-32bytes-minimum-do-not-use-in-prod
      AUTH_DEV_MODE: "1"

  ext-egrul:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/ext-egrul

  ext-rosfinmon:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/ext-rosfinmon

  ext-fssp:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/ext-fssp

  abs-connector:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/abs-connector

  abs-adapter-cft:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/abs-adapter-cft

  abs-adapter-diasoft:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/abs-adapter-diasoft

  abs-adapter-rs-bank:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/abs-adapter-rs-bank

  billing-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/billing-service

  bff-onboarding:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/bff-onboarding
    environment:
      JWT_SECRET: aibank-staging-dev-secret-32bytes-minimum-do-not-use-in-prod

  bff-admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: services/bff-admin
    environment:
      JWT_SECRET: aibank-staging-dev-secret-32bytes-minimum-do-not-use-in-prod

  db-migrator-platform:
    build:
      context: .
      dockerfile: docker/Dockerfile.go-service
      args:
        SERVICE_PATH: tools/db-migrator

  # ────────────────────────────────────────────────────────────
  # Python AI-агенты: healthcheck disable (slim — нет wget/curl)
  # ────────────────────────────────────────────────────────────

  # llm-gateway имеет 4 зависимых сервиса с depends_on service_healthy
  # (agent-document-intake, -reconciliation, -ubo-tracing, -conversational).
  # disable: true ломает condition → "no healthcheck configured".
  # Заменяем wget на Python urllib (gateway сам на python:3.12-slim).
  llm-gateway:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-document-intake:
    healthcheck:
      disable: true

  agent-reconciliation:
    healthcheck:
      disable: true

  agent-ubo-tracing:
    healthcheck:
      disable: true

  agent-conversational:
    healthcheck:
      disable: true
