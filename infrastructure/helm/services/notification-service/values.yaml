replicaCount: 1

image:
  repository: aibank/notification-service
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8083

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  DATABASE_URL: ""
  TENANT_URL: "http://tenant-service:8080"
  AUDIT_URL: "http://audit-service:8081"
