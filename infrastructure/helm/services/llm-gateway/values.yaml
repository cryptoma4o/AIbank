replicaCount: 1

image:
  repository: aibank/llm-gateway
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8100

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  MODEL_BACKENDS: "gemma=http://vllm-gemma:8000,qwen=http://vllm-qwen:8000"
  DEFAULT_MODEL: "gemma"
  AUDIT_URL: "http://audit-service:8081"
