stages:
  - lint
  - codegen
  - test
  - build
  - security
  - e2e
  - deploy-staging
  - deploy-prod

variables:
  REGISTRY: registry.gitlab.com/aibank
  GO_VERSION: "1.22"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

default:
  image: alpine:3.19
  tags:
    - docker

# ─── LINT ──────────────────────────────────────────────────────────────────────

lint:go:
  stage: lint
  image: golangci/golangci-lint:v1.57
  script:
    - |
      for dir in services/*/; do
        [ -f "$dir/go.mod" ] && (cd "$dir" && golangci-lint run ./...) || true
      done
    - |
      for dir in packages/*/; do
        [ -f "$dir/go.mod" ] && (cd "$dir" && golangci-lint run ./...) || true
      done
  rules:
    - changes:
        - "services/**/*.go"
        - "packages/**/*.go"

lint:python:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff --quiet
    - ruff check ai/ packages/audit-sdk/python/ tools/data-generator/
  rules:
    - changes:
        - "ai/**/*.py"
        - "packages/**/*.py"
        - "tools/**/*.py"

lint:frontend:
  stage: lint
  image: node:20-alpine
  script:
    - |
      for dir in apps/*/; do
        [ -f "$dir/package.json" ] && (cd "$dir" && npm ci --silent && npm run lint) || true
      done
  rules:
    - changes:
        - "apps/**/*.ts"
        - "apps/**/*.tsx"

lint:proto:
  stage: lint
  image: bufbuild/buf:1.30
  script:
    - cd packages/proto && buf lint
  rules:
    - changes:
        - "packages/proto/**/*.proto"

openapi:lint:
  stage: lint
  image: node:20-alpine
  script:
    - npm install --global @stoplight/spectral-cli@6.11.1
    - |
      if [ ! -f packages/openapi/.spectral.yaml ]; then
        cat > packages/openapi/.spectral.yaml <<'EOF'
      extends: ["spectral:oas"]
      rules:
        oas3-shared-components: error
        operation-tag-defined: error
        operation-operationId: error
        operation-description: warn
        info-contact: off
        info-description: warn
        no-$ref-siblings: error
      EOF
      fi
    - |
      fail=0
      for spec in packages/openapi/*.yaml packages/openapi/*.yml; do
        [ -f "$spec" ] || continue
        echo "→ spectral lint $spec"
        spectral lint "$spec" --ruleset packages/openapi/.spectral.yaml --fail-severity=error || fail=1
      done
      exit $fail
  rules:
    - changes:
        - "packages/openapi/**/*.yaml"
        - "packages/openapi/**/*.yml"

helm:lint:
  stage: lint
  image: alpine/helm:3.15.2
  script:
    - apk add --no-cache findutils
    - |
      fail=0
      for chart in $(find infrastructure/helm -name Chart.yaml -mindepth 2 -maxdepth 5); do
        chart_dir=$(dirname "$chart")
        echo "─── helm lint $chart_dir ──────────────────────────"
        if grep -qE '^dependencies:' "$chart" 2>/dev/null; then
          (cd "$chart_dir" && helm dependency update . || helm dependency build . || true)
        fi
        helm lint "$chart_dir" --strict || fail=1
        helm template release-name "$chart_dir" >/dev/null || fail=1
      done
      exit $fail
  rules:
    - changes:
        - "infrastructure/helm/**"

# ─── CODEGEN ───────────────────────────────────────────────────────────────────

codegen:verify:
  stage: codegen
  image: python:3.13-slim
  before_script:
    - apt-get update -qq && apt-get install -qq -y git make
    - pip install --quiet pydantic jinja2 datamodel-code-generator || true
  script:
    - cd packages/domain-model && make generate
    - cd ../..
    - |
      if ! git diff --exit-code packages/domain-model/generated/; then
        echo ""
        echo "ERROR: Generated files differ from committed state."
        echo "Run 'cd packages/domain-model && make generate' locally and commit the result."
        exit 1
      fi
    - echo "domain-model codegen OK"
    - |
      if [ -f packages/proto/buf.gen.yaml ]; then
        echo "→ checking proto codegen"
        # buf is not pre-installed; install from release tarball
        BUF_VERSION=1.34.0
        curl -sSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64" -o /usr/local/bin/buf
        chmod +x /usr/local/bin/buf
        (cd packages/proto && buf generate)
        if ! git diff --exit-code packages/proto/generated/; then
          echo "ERROR: proto codegen out of sync. Run 'cd packages/proto && buf generate'."
          exit 1
        fi
      fi
  rules:
    - changes:
        - "packages/domain-model/**"
        - "packages/proto/**"
        - "packages/openapi/**"

# ─── TEST ──────────────────────────────────────────────────────────────────────

test:go:packages:
  stage: test
  image: golang:1.22-alpine
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: aibank
    POSTGRES_PASSWORD: aibank
    POSTGRES_DB: aibank_test
    DATABASE_URL: "postgres://aibank:aibank@postgres:5432/aibank_test?sslmode=disable"
  script:
    - |
      for dir in packages/*/; do
        [ -f "$dir/go.mod" ] && (cd "$dir" && go test ./... -v -count=1) || true
      done
  rules:
    - changes:
        - "packages/**/*.go"

test:go:services:
  stage: test
  image: golang:1.22-alpine
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_USER: aibank
    POSTGRES_PASSWORD: aibank
    POSTGRES_DB: aibank_test
    DATABASE_URL: "postgres://aibank:aibank@postgres:5432/aibank_test?sslmode=disable"
    REDIS_URL: "redis://redis:6379"
  script:
    - |
      for dir in services/*/; do
        [ -f "$dir/go.mod" ] && (cd "$dir" && go test ./... -v -count=1 -short) || true
      done
  rules:
    - changes:
        - "services/**/*.go"

test:python:
  stage: test
  image: python:3.12-slim
  script:
    - pip install pytest pytest-asyncio httpx pydantic rich click --quiet
    - cd ai/eval-harness && python -m pytest tests/ -v
  rules:
    - changes:
        - "ai/**/*.py"

test:eval-harness:
  stage: test
  image: python:3.12-slim
  script:
    - pip install pytest pytest-asyncio httpx pydantic rich click --quiet
    - cd ai/eval-harness && python -m pytest tests/ -v
  rules:
    - changes:
        - "ai/eval-harness/**"

# ─── BUILD ─────────────────────────────────────────────────────────────────────

.build-docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build -t $REGISTRY/$SERVICE:$CI_COMMIT_SHORT_SHA -t $REGISTRY/$SERVICE:latest ./$BUILD_DIR
      docker push $REGISTRY/$SERVICE:$CI_COMMIT_SHORT_SHA
      docker push $REGISTRY/$SERVICE:latest
  only:
    - main

build:api-gateway:
  extends: .build-docker
  variables:
    SERVICE: api-gateway
    BUILD_DIR: services/api-gateway

build:onboarding-orchestrator:
  extends: .build-docker
  variables:
    SERVICE: onboarding-orchestrator
    BUILD_DIR: services/onboarding-orchestrator

build:llm-gateway:
  extends: .build-docker
  variables:
    SERVICE: llm-gateway
    BUILD_DIR: ai/llm-gateway

build:web-onboarding:
  extends: .build-docker
  variables:
    SERVICE: web-onboarding
    BUILD_DIR: apps/web-onboarding

build:web-admin:
  extends: .build-docker
  variables:
    SERVICE: web-admin
    BUILD_DIR: apps/web-admin

# ─── SECURITY ──────────────────────────────────────────────────────────────────

security:secrets:
  stage: security
  image: trufflesecurity/trufflehog:latest
  script:
    - trufflehog git file://. --since-commit HEAD~1 --fail
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

security:go-vuln:
  stage: security
  image: golang:1.22-alpine
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - |
      for dir in services/*/; do
        [ -f "$dir/go.mod" ] && (cd "$dir" && govulncheck ./...) || true
      done
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ─── E2E ───────────────────────────────────────────────────────────────────────
# Runs scripts/smoke.sh against an ephemeral docker-compose stack.
# Gates deployment to staging/prod (see ADR-0005 + smoke.sh contract).

e2e:smoke:
  stage: e2e
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    COMPOSE_PROJECT_NAME: aibank-ci-${CI_PIPELINE_ID}
  before_script:
    - apk add --no-cache bash curl jq make docker-compose
  script:
    - echo "→ Building docker-compose stack"
    - docker compose build --parallel
    - echo "→ Starting stack"
    - docker compose up -d
    - echo "→ Applying platform migrations"
    - make migrate-platform
    - echo "→ Running smoke test"
    - bash scripts/smoke.sh
  after_script:
    - echo "→ Tearing down stack (post-smoke)"
    - docker compose down -v || true
  artifacts:
    when: always
    paths:
      - /tmp/aibank-smoke-state/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false
  timeout: 30m

# ─── DEPLOY ────────────────────────────────────────────────────────────────────

deploy:staging:
  stage: deploy-staging
  image: bitnami/kubectl:1.30
  script:
    - kubectl config use-context $KUBE_CONTEXT_STAGING
    - helm upgrade --install aibank-staging infrastructure/helm/aibank/
        --namespace aibank-staging
        --create-namespace
        --set global.imageTag=$CI_COMMIT_SHORT_SHA
        --wait --timeout 10m
  environment:
    name: staging
    url: https://staging.aibank.ru
  only:
    - main

deploy:prod:
  stage: deploy-prod
  image: bitnami/kubectl:1.30
  script:
    - kubectl config use-context $KUBE_CONTEXT_PROD
    - helm upgrade --install aibank infrastructure/helm/aibank/
        --namespace aibank
        --create-namespace
        --set global.imageTag=$CI_COMMIT_SHORT_SHA
        --wait --timeout 15m
  environment:
    name: production
    url: https://aibank.ru
  when: manual
  only:
    - main
