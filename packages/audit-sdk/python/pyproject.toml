[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aibank-audit-sdk"
version = "0.1.0"
description = "Tiny client for the AIbank platform audit-service HTTP API."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AIbank Platform" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aibank_audit*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
