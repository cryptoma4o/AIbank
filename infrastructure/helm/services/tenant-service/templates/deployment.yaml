apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tenant-service.fullname" . }}
  labels:
    {{- include "tenant-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tenant-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tenant-service.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: tenant-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: "postgres://aibank:$(POSTGRESQL_PASSWORD)@{{ .Values.postgresql.host | default .Values.global.postgresql.host }}:{{ .Values.global.postgresql.port }}/{{ .Values.postgresql.database }}"
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.postgresql.existingSecret }}
                  key: {{ .Values.global.postgresql.secretKey }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
