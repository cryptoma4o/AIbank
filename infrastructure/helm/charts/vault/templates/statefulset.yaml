apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vault.fullname" . }}
  labels: {{- include "vault.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "vault.fullname" . }}-internal
  selector:
    matchLabels: {{- include "vault.selectorLabels" . | nindent 6 }}
  podManagementPolicy: Parallel
  template:
    metadata:
      labels: {{- include "vault.selectorLabels" . | nindent 8 }}
      annotations:
        # Re-roll на изменение config (чтобы при helm upgrade перечитать seal).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "vault.serviceAccountName" . }}
      {{- if .Values.affinity.enabled }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {{- include "vault.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: vault
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["vault", "server", "-config=/vault/config/vault.hcl"]
          ports:
            - name: api
              containerPort: 8200
            - name: cluster
              containerPort: {{ .Values.service.internalPort }}
          env:
            - name: VAULT_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VAULT_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VAULT_API_ADDR
              value: "http://$(VAULT_K8S_POD_NAME).{{ include "vault.fullname" . }}-internal.$(VAULT_K8S_NAMESPACE).svc.cluster.local:8200"
            - name: VAULT_CLUSTER_ADDR
              value: "http://$(VAULT_K8S_POD_NAME).{{ include "vault.fullname" . }}-internal.$(VAULT_K8S_NAMESPACE).svc.cluster.local:{{ .Values.service.internalPort }}"
            - name: SKIP_SETCAP
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /vault/data
            - name: config
              mountPath: /vault/config
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /vault/tls
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: api
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              # 200 — active or standby; 429 — uninitialized; 501 — sealed.
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: api
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]   # mlockall — Vault лучше не свопить
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
      volumes:
        - name: config
          configMap:
            name: {{ include "vault.fullname" . }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.certSecret }}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
