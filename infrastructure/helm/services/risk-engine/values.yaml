replicaCount: 1

image:
  repository: aibank/risk-engine
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8085

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  RULES_PATH: "/app/rules/default.yaml"
  AUDIT_URL: "http://audit-service:8081"
