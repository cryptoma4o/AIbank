services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aibank
      POSTGRES_PASSWORD: aibank
      POSTGRES_DB: aibank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibank"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kafka-logs

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      # Console port 9001 переехал на host:9101 (см. docker-compose.override.yml).
      # Conflict: abs-adapter-cft использует host:9001.
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.24
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=aibank
      - POSTGRES_PWD=aibank
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.26.2
    # Host port для UI задаётся в docker-compose.override.yml (8094:8080).
    # Conflict: client-service использует host:8089.
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # ── Core services ──────────────────────────────────────────
  tenant-service:
    build: ./services/tenant-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  audit-service:
    build: ./services/audit-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  identity-service:
    build: ./services/identity-service
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
      JWT_SECRET: "dev-secret-change-in-prod-32bytes!!"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  document-service:
    build: ./services/document-service
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
      STORAGE_BACKEND: memory
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  notification-service:
    build: ./services/notification-service
    ports:
      - "8110:8110"
    restart: unless-stopped

  onboarding-orchestrator:
    build: ./services/onboarding-orchestrator
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
    depends_on:
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  risk-engine:
    build: ./services/risk-engine
    ports:
      - "8086:8086"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
      RULES_PATH: rules/default.yaml
    restart: unless-stopped

  client-service:
    build: ./services/client-service
    ports:
      - "8089:8089"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ubo-service:
    build: ./services/ubo-service
    ports:
      - "8097:8090"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── API Gateway ─────────────────────────────────────────────
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    environment:
      JWT_PUBLIC_KEY_PEM: ""
    depends_on:
      - tenant-service
      - onboarding-orchestrator
      - risk-engine
      - identity-service
      - client-service
      - ubo-service
      - document-service
      - audit-service
      - notification-service
    restart: unless-stopped

  # ── External integrations ────────────────────────────────────
  ext-egrul:
    build: ./services/ext-egrul
    ports:
      - "8201:8201"
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  ext-rosfinmon:
    build: ./services/ext-rosfinmon
    ports:
      - "8202:8202"
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  ext-fssp:
    build: ./services/ext-fssp
    ports:
      - "8203:8203"
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  # ── ABS layer ────────────────────────────────────────────────
  abs-connector:
    build: ./services/abs-connector
    ports:
      - "8088:8088"
    environment:
      DEDUP_STORE: redis
      REDIS_URL: redis://redis:6379
      ABS_ADAPTERS_CONFIG: /app/configs/adapters.yaml
    depends_on:
      - redis
      - abs-adapter-cft
    restart: unless-stopped

  abs-adapter-cft:
    build: ./services/abs-adapter-cft
    ports:
      - "9001:9001"
    restart: unless-stopped

  abs-adapter-diasoft:
    build: ./services/abs-adapter-diasoft
    ports:
      - "9002:9002"
    restart: unless-stopped

  abs-adapter-rs-bank:
    build: ./services/abs-adapter-rs-bank
    ports:
      - "9003:9003"
    restart: unless-stopped

  billing-service:
    build: ./services/billing-service
    ports:
      - "8087:8087"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
      TENANT_SERVICE_URL: http://tenant-service:8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  bff-onboarding:
    build: ./services/bff-onboarding
    ports:
      - "8091:8091"
    environment:
      TENANT_SERVICE_URL: http://tenant-service:8080
      IDENTITY_SERVICE_URL: http://identity-service:8082
      DOCUMENT_SERVICE_URL: http://document-service:8083
      ORCHESTRATOR_URL: http://onboarding-orchestrator:8085
      RISK_ENGINE_URL: http://risk-engine:8086
      JWT_SECRET: dev-secret-change-in-prod-32bytes!!
    depends_on:
      - onboarding-orchestrator
      - client-service
      - document-service
      - identity-service
    restart: unless-stopped

  bff-admin:
    build: ./services/bff-admin
    ports:
      - "8092:8092"
    environment:
      TENANT_SERVICE_URL: http://tenant-service:8080
      AUDIT_SERVICE_URL: http://audit-service:8081
      ORCHESTRATOR_URL: http://onboarding-orchestrator:8085
      RISK_ENGINE_URL: http://risk-engine:8086
      IDENTITY_SERVICE_URL: http://identity-service:8082
    depends_on:
      - tenant-service
      - audit-service
      - risk-engine
      - identity-service
      - onboarding-orchestrator
    restart: unless-stopped

  # ── AI Layer ────────────────────────────────────────────────
  llm-gateway:
    build: ./ai/llm-gateway
    ports:
      - "8100:8100"
    environment:
      LLM_GATEWAY_FORCE_MOCK: "1"
      LOG_REQUESTS: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8100/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  agent-document-intake:
    build: ./ai/agent-document-intake
    ports:
      - "8101:8101"
    environment:
      LLM_GATEWAY_URL: http://llm-gateway:8100
    depends_on:
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8101/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  agent-reconciliation:
    build: ./ai/agent-reconciliation
    ports:
      - "8102:8102"
    environment:
      LLM_GATEWAY_URL: http://llm-gateway:8100
    depends_on:
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8102/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  agent-ubo-tracing:
    build: ./ai/agent-ubo-tracing
    ports:
      - "8103:8103"
    environment:
      LLM_GATEWAY_URL: http://llm-gateway:8100
    depends_on:
      llm-gateway:
        condition: service_healthy
      ext-egrul:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8103/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  agent-conversational:
    build: ./ai/agent-conversational
    ports:
      - "8104:8104"
    environment:
      LLM_GATEWAY_URL: http://llm-gateway:8100
    depends_on:
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8104/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # TODO: add when service is wired — agent-risk-scoring main.py listens on :8104
  # which collides with agent-conversational; needs port realignment in service code
  # before adding to compose. Current main.py is a runnable stub but lacks
  # integration tests / smoke coverage in this iteration.
  #
  # TODO: add when service is wired — agent-compliance-assistant depends on
  # rag-service, which itself needs Qdrant collection bootstrap. Both have
  # runnable main.py stubs but are not part of the happy-path smoke flow yet.
  #
  # TODO: add when service is wired — rag-service requires Qdrant collection
  # provisioning + embedding model configuration before it can serve requests.

  # ── Migration jobs (one-shot, profile: migrate) ────────────
  db-migrator-platform:
    build: ./tools/db-migrator
    profiles: ["migrate"]
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
    command:
      - "platform"
      - "--service"
      - "tenant-service"
      - "--source"
      - "/migrations/tenant-service"
    volumes:
      - ./services/tenant-service/migrations:/migrations/tenant-service:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Frontend apps ──────────────────────────────────────────
  web-onboarding:
    build: ./apps/web-onboarding
    ports:
      - "3000:3000"
    environment:
      BFF_URL: http://bff-onboarding:8091/graphql
      CHAT_URL: http://agent-conversational:8104
    depends_on:
      - bff-onboarding
      - agent-conversational
    restart: unless-stopped

  web-admin:
    build: ./apps/web-admin
    ports:
      - "3001:3000"
    environment:
      BFF_ADMIN_URL: http://bff-admin:8092/graphql
    depends_on:
      - bff-admin
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
