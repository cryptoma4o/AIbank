replicaCount: 1

image:
  repository: aibank/agent-compliance-assistant
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8107

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  LLM_GATEWAY_URL: "http://llm-gateway:8100"
  RAG_URL: "http://rag-service:8105"
  AUDIT_URL: "http://audit-service:8081"
