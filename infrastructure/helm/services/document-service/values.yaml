replicaCount: 1

image:
  repository: aibank/document-service
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8082

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  DATABASE_URL: ""
  MINIO_ENDPOINT: "minio:9000"
  MINIO_ACCESS_KEY: ""
  MINIO_SECRET_KEY: ""
  AUDIT_URL: "http://audit-service:8081"
  LLM_GATEWAY_URL: "http://llm-gateway:8100"
