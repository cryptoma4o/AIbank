[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aibank-domain-model"
version = "1.0.0"
description = "Generated Pydantic models for the AIbank canonical domain (auto-generated from schema.json)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aibank_domain*"]
