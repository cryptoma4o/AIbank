apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "abs-adapter-diasoft.fullname" . }}
  labels:
    {{- include "abs-adapter-diasoft.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "abs-adapter-diasoft.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "abs-adapter-diasoft.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: abs-adapter-diasoft
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9002
              protocol: TCP
          env:
            - name: AUDIT_URL
              value: {{ .Values.env.AUDIT_URL | quote }}
            - name: DIASOFT_ENDPOINT
              value: {{ .Values.env.DIASOFT_ENDPOINT | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9002
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9002
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
