# buf.gen.yaml — code generation pipeline for AIbank canonical proto.
#
# Three target languages (Go / TypeScript / Python) are produced by `buf
# generate`. All plugins are pulled from the public buf.build remote registry,
# so neither developers nor CI need a local protoc / language-specific
# toolchain — the only requirement is the `buf` binary itself
# (bufbuild/buf-action in CI; brew install bufbuild/buf/buf locally).
#
# Output layout (mirrors packages/domain-model/generated/):
#   generated/go/      — Go protobuf + gRPC client/server stubs
#   generated/ts/      — TypeScript types + service definitions (ts-proto idiom)
#   generated/python/  — Python protobuf + gRPC client/server stubs
#
# Determinism: no plugin emits timestamps; the only non-deterministic header
# is "// Code generated by protoc-gen-go" which itself is byte-identical for
# the same plugin version. CI's `make verify` target enforces zero drift.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/aibank/platform/packages/proto/generated/go
plugins:
  # ---- Go ----
  - remote: buf.build/protocolbuffers/go
    out: generated/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: generated/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  # ---- TypeScript (ts-proto, no external buf-registry deps) ----
  # We use the community stephenh/ts-proto plugin which produces idiomatic TS
  # interfaces + grpc-js or @grpc/grpc-js compatible service definitions and
  # does NOT require consumers to import from buf.build/<registry>.
  - remote: buf.build/community/stephenh-ts-proto
    out: generated/ts
    opt:
      - esModuleInterop=true
      - outputServices=grpc-js
      - useOptionals=messages
      - forceLong=string
      - env=node

  # ---- Python (gRPC + types) ----
  - remote: buf.build/protocolbuffers/python
    out: generated/python/aibank_proto
  - remote: buf.build/protocolbuffers/pyi
    out: generated/python/aibank_proto
  - remote: buf.build/grpc/python
    out: generated/python/aibank_proto
