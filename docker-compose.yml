version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aibank
      POSTGRES_PASSWORD: aibank
      POSTGRES_DB: aibank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibank"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kafka-logs

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.24
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=aibank
      - POSTGRES_PWD=aibank
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.26.2
    ports:
      - "8089:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # ── Core services ──────────────────────────────────────────
  tenant-service:
    build: ./services/tenant-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  audit-service:
    build: ./services/audit-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  document-service:
    build: ./services/document-service
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build: ./services/notification-service
    ports:
      - "8083:8083"
    restart: unless-stopped

  onboarding-orchestrator:
    build: ./services/onboarding-orchestrator
    ports:
      - "8084:8084"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
    depends_on:
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  risk-engine:
    build: ./services/risk-engine
    ports:
      - "8085:8085"
    environment:
      RULES_PATH: rules/default.yaml
    restart: unless-stopped

  identity-service:
    build: ./services/identity-service
    ports:
      - "8086:8086"
    environment:
      ESIA_CLIENT_ID: aibank-dev
      ESIA_REDIRECT_URI: http://localhost:8086/v1/auth/esia/callback
    restart: unless-stopped

  client-service:
    build: ./services/client-service
    ports:
      - "8087:8087"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ubo-service:
    build: ./services/ubo-service
    ports:
      - "8088:8088"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── API Gateway ─────────────────────────────────────────────
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    environment:
      JWT_PUBLIC_KEY_PEM: ""
    depends_on:
      - tenant-service
      - onboarding-orchestrator
      - risk-engine
      - identity-service
      - client-service
      - ubo-service
      - document-service
      - audit-service
      - notification-service
    restart: unless-stopped

  # ── External integrations ────────────────────────────────────
  ext-egrul:
    build: ./services/ext-egrul
    ports:
      - "8090:8090"
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  ext-rosfinmon:
    build: ./services/ext-rosfinmon
    ports:
      - "8091:8091"
    restart: unless-stopped

  ext-fssp:
    build: ./services/ext-fssp
    ports:
      - "8092:8092"
    restart: unless-stopped

  # ── ABS layer ────────────────────────────────────────────────
  abs-connector:
    build: ./services/abs-connector
    ports:
      - "8093:8093"
    environment:
      REDIS_ADDR: redis:6379
    depends_on:
      - redis
      - abs-adapter-cft
    restart: unless-stopped

  abs-adapter-cft:
    build: ./services/abs-adapter-cft
    ports:
      - "9001:9001"
    restart: unless-stopped

  abs-adapter-diasoft:
    build: ./services/abs-adapter-diasoft
    ports:
      - "9002:9002"
    restart: unless-stopped

  abs-adapter-rs-bank:
    build: ./services/abs-adapter-rs-bank
    ports:
      - "9003:9003"
    restart: unless-stopped

  billing-service:
    build: ./services/billing-service
    ports:
      - "8096:8096"
    environment:
      DATABASE_URL: postgres://aibank:aibank@postgres:5432/aibank?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  bff-onboarding:
    build: ./services/bff-onboarding
    ports:
      - "8094:8094"
    environment:
      ONBOARDING_URL: http://onboarding-orchestrator:8084
      CLIENT_URL: http://client-service:8087
      DOCUMENT_URL: http://document-service:8082
      IDENTITY_URL: http://identity-service:8086
    depends_on:
      - onboarding-orchestrator
      - client-service
      - document-service
      - identity-service
    restart: unless-stopped

  bff-admin:
    build: ./services/bff-admin
    ports:
      - "8095:8095"
    environment:
      TENANT_URL: http://tenant-service:8080
      AUDIT_URL: http://audit-service:8081
      RISK_URL: http://risk-engine:8085
      CLIENT_URL: http://client-service:8087
      UBO_URL: http://ubo-service:8088
    depends_on:
      - tenant-service
      - audit-service
      - risk-engine
      - client-service
      - ubo-service
    restart: unless-stopped

  # ── AI Layer ────────────────────────────────────────────────
  llm-gateway:
    build: ./ai/llm-gateway
    ports:
      - "8100:8100"
    environment:
      MODEL_BACKENDS: "gemma-4=http://vllm:8000"
      LOG_REQUESTS: "true"
    restart: unless-stopped

  agent-document-intake:
    build: ./ai/agent-document-intake
    ports:
      - "8101:8101"
    depends_on:
      - llm-gateway
    restart: unless-stopped

  agent-ubo-tracing:
    build: ./ai/agent-ubo-tracing
    ports:
      - "8102:8102"
    depends_on:
      - llm-gateway
      - ext-egrul
    restart: unless-stopped

  agent-reconciliation:
    build: ./ai/agent-reconciliation
    ports:
      - "8103:8103"
    depends_on:
      - ext-egrul
      - ext-rosfinmon
    restart: unless-stopped

  agent-risk-scoring:
    build: ./ai/agent-risk-scoring
    ports:
      - "8104:8104"
    depends_on:
      - llm-gateway
      - risk-engine
    restart: unless-stopped

  rag-service:
    build: ./ai/rag-service
    ports:
      - "8105:8105"
    depends_on:
      - llm-gateway
      - qdrant
    restart: unless-stopped

  agent-conversational:
    build: ./ai/agent-conversational
    ports:
      - "8106:8106"
    depends_on:
      - llm-gateway
    restart: unless-stopped

  agent-compliance-assistant:
    build: ./ai/agent-compliance-assistant
    ports:
      - "8107:8107"
    depends_on:
      - llm-gateway
      - rag-service
    restart: unless-stopped

  web-onboarding:
    build: ./apps/web-onboarding
    ports:
      - "3000:3000"
    environment:
      BFF_URL: http://bff-onboarding:8094/graphql
      CHAT_URL: http://agent-conversational:8106
    depends_on:
      - bff-onboarding
      - agent-conversational
    restart: unless-stopped

  web-admin:
    build: ./apps/web-admin
    ports:
      - "3001:3001"
    environment:
      BFF_ADMIN_URL: http://bff-admin:8095/graphql
    depends_on:
      - bff-admin
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
