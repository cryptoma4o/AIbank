{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aibank-service.fullname" . }}
  labels:
    {{- include "aibank-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aibank-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.ingressFrom }}
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: {{ .Values.service.targetPort | default .Values.service.port }}
          protocol: TCP
    {{- else }}
    # Default-deny: explicitly empty rule allows nothing.
    # Override via networkPolicy.ingressFrom.
    - from: []
      ports:
        - port: {{ .Values.service.targetPort | default .Values.service.port }}
          protocol: TCP
    {{- end }}
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow egress within the cluster (Postgres, Kafka, Redis, etc).
    # Tighten via override on a per-service basis.
    - to:
        - namespaceSelector: {}
{{- end }}
