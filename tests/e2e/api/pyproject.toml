[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aibank-e2e-api"
version = "0.1.0"
description = "E2E API tests for AIbank onboarding (pytest-based)."
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-json-report>=1.5",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "scenario: API-сценарии онбординга из tests/e2e/api/scenarios.py",
    "admin: admin-flow тесты через bff-admin",
    "audit: audit-trail проверки",
]
